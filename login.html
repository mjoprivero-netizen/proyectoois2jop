<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Acceso - UDL</title>
    
    <!-- Importación de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Estilos CSS personalizados -->
    <style>
        .box {
            max-width: 360px;
            margin: 50px auto;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
            font-family: sans-serif;
            background: #fff;
        }

        /* CAMBIO 1 (Color): Modificación del degradado a tonos amarillos y dorados elegantes (#f39c12, #f1c40f, #d35400) */
        .sky {
            height: 120px;
            background: linear-gradient(135deg, #f39c12, #f1c40f, #d35400);
            position: relative;
            text-align: center;
            color: #fff;
            padding-top: 35px;
        }

        .sky h2 {
            margin: 0;
            font-size: 20px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .sky p {
            margin: 4px 0 0;
            font-size: 12px;
            opacity: .9;
        }

        .sky::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 30px;
            background: #fff;
            border-radius: 50% 50% 0 0;
        }

        .body {
            padding: 24px;
        }

        .body label {
            display: block;
            font-size: 13px;
            margin: 12px 0 4px;
            color: #444;
        }

        .body .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .body .form-control:focus {
            outline: none;
            box-shadow: none;
            border-color: #f39c12; /* Color de foco amarillo/dorado acorde al diseño */
        }

        .body .btn-custom {
            width: 100%;
            margin-top: 18px;
            padding: 11px;
            background: #f39c12; /* Botón con el color amarillo corporativo */
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .body .btn-custom:hover {
            opacity: .85;
            color: #fff;
            background: #e67e22;
        }

        /* Estilo para el Cambio 3 (Pie de página / Versión para GitHub) */
        .footer-version {
            text-align: center;
            font-size: 11px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body class="bg-light">

    <div class="box">
        <div class="sky">
            <!-- CAMBIO 2 (Texto): Títulos y textos actualizados -->
            <h2>Portal de Acceso</h2>
            <p>Inicia sesión con tus credenciales</p>
        </div>

        <div class="body">
            <form id="loginForm">
                <div>
                    <label>Nombre</label>
                    <input type="text" class="form-control" placeholder="Captura nombre de usuario" required>
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" id="email" class="form-control" placeholder="user_name@dominio.com" required>
                </div>

                <div>
                    <label>Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-custom">Ingresar al sistema</button>
                
                <!-- CAMBIO 3: Etiqueta de versión para documentar los cambios en GitHub -->
                <div class="footer-version">
                    v1.2.0 - UDL Secure Auth
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            try {
                const res = await fetch('usuarios.xml');
                const xmlText = await res.text();
                const xmlDoc = new DOMParser().parseFromString(xmlText, 'application/xml');

                const usuarios = Array.from(xmlDoc.querySelectorAll('usuario'));
                const existe = usuarios.some(u =>
                    u.querySelector('email').textContent === email &&
                    u.querySelector('password').textContent === pass
                );

                if
